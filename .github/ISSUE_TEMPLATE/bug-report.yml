name: Bug report
description: 报告可复现的功能错误或崩溃
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除数据库、讲稿、截图中的敏感信息。安全漏洞请使用私密安全报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 安装包版本或提交哈希
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 选择…\n3. 观察…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 不要粘贴令牌、私人讲稿或其他敏感信息
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 我已移除个人数据和有效凭据
          required: true
